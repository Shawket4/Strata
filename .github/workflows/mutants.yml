# Mutation testing of the shared crates (PLAN §16). About 2,100 mutants take hours, so this runs
# nightly and on demand, split into shards, instead of on every push (ci.yml).
name: Mutants

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency:
  group: mutants
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation testing (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutate vault-format, text-normalize, domain (fails on any missed mutant)
        run: >-
          cargo mutants -p vault-format -p text-normalize -p domain
          --timeout 180 --no-shuffle --in-place --shard ${{ matrix.shard }}/8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
