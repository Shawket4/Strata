# Release builds (docs/RUNBOOK.md §13). Tests stay in ci.yml; this workflow builds and packages:
#   stratad-linux-x86_64   the server binary tarball (+ draft GitHub Release on v* tags)
#   app-android            release APKs (universal + one per ABI)
#   app-macos              the universal (arm64 + x86_64) macOS app, ad-hoc signed, zip + dmg
#   strata-*-debug-symbols the Dart split debug info of the obfuscated app builds (90 days; for
#                          `flutter symbolize`, not part of the release)
# The apps' server is fixed at build time: STRATA_SERVER_URL below (the owner's server, or the
# repository variable of the same name when set), baked in with --dart-define. The apps have no
# server field; a value that is not an https:// address fails the build.
# Actions are pinned to commit SHAs (the tag is in the comment).
name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.47.5
  # The server every account of the Android and macOS apps uses (never shown or editable).
  STRATA_SERVER_URL: ${{ vars.STRATA_SERVER_URL || 'https://strata-ai.duckdns.org' }}

jobs:
  stratad-linux-x86_64:
    name: stratad (Linux x86_64, glibc 2.35)
    # Ubuntu 22.04 links against glibc 2.35, so the binary runs on Debian 12+, Ubuntu 22.04+
    # and other common VPS distributions. Not musl: ort loads ONNX Runtime with dlopen
    # (load-dynamic), which needs a glibc build.
    runs-on: ubuntu-22.04
    permissions:
      contents: write # the draft release on v* tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: stratad-release
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="sha-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "name=stratad-$v-linux-x86_64" >> "$GITHUB_OUTPUT"
      - name: Build (release)
        run: cargo build --release --locked -p stratad
      - name: Check the binary
        run: |
          file target/release/stratad
          ldd target/release/stratad
          # Highest glibc symbol version the binary needs (must be <= 2.35).
          objdump -T target/release/stratad | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          target/release/stratad --version
          cd deploy && ../target/release/stratad --env-file stratad.env.example check-config > /dev/null
      - name: Package
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p "dist/$NAME"
          cp target/release/stratad "dist/$NAME/stratad"
          strip "dist/$NAME/stratad"
          cp deploy/stratad.env.example deploy/stratad.service deploy/VPS_SETUP.md "dist/$NAME/"
          cp deploy/README.release.md "dist/$NAME/README.md"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -l dist
          cat "dist/$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stratad-linux-x86_64
          path: |
            dist/${{ steps.version.outputs.name }}.tar.gz
            dist/${{ steps.version.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  app-android:
    name: Android APK (release)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client/app/apps/strata
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Android NDK (the version the Flutter Gradle plugin asks for)
        run: |
          ndk=$(grep -oE 'val ndkVersion: String = "[0-9.]+"' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "NDK $ndk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - name: Rust Android targets
        # cargokit builds the client core with `rustup run stable`.
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
          cache-targets: false
          # cargokit's target directory for the strata_bridge plugin.
          cache-directories: client/app/apps/strata/build/strata_bridge/build
      - name: Signing
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            keystore="$RUNNER_TEMP/strata-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
            echo "kind=release-signed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Android signing secrets are not set: the APKs are signed with a debug key (sideload only; each CI run has a different debug key)."
            echo "kind=debug-signed" >> "$GITHUB_OUTPUT"
          fi
      - name: Server address
        # The app refuses to start without an https:// address; fail here instead.
        run: |
          case "$STRATA_SERVER_URL" in
            *[[:space:]]*) echo "::error::STRATA_SERVER_URL contains spaces."; exit 1 ;;
            https://?*) echo "server: $STRATA_SERVER_URL" ;;
            *) echo "::error::STRATA_SERVER_URL must be an https:// address, got '$STRATA_SERVER_URL'."; exit 1 ;;
          esac
      - run: flutter pub get
      - name: Build APKs
        # One universal APK (sideload on any device) and one per ABI (about a third of the size
        # each: the Rust core is most of the APK). The second build reuses the cargo output.
        # Dart is obfuscated; its symbols (one file per ABI) go to build/debug-info/android for
        # `flutter symbolize` (docs/RUNBOOK.md §13). Both builds compile the same Dart code.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="sha-${GITHUB_SHA::7}"; fi
          kind="${{ steps.signing.outputs.kind }}"
          out=build/app/outputs/flutter-apk
          mkdir -p dist
          define="--dart-define=STRATA_SERVER_URL=$STRATA_SERVER_URL"
          symbols=(--obfuscate --split-debug-info=build/debug-info/android)
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER" "${symbols[@]}" "$define"
          cp "$out/app-release.apk" "dist/strata-$v-android-universal-$kind.apk"
          flutter build apk --release --split-per-abi --build-number "$GITHUB_RUN_NUMBER" \
            "${symbols[@]}" "$define"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "dist/strata-$v-android-$abi-$kind.apk"
          done
      - name: Verify signatures and application ID
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "== $apk"
            "$tools/apksigner" verify --print-certs "$apk"
            "$tools/aapt2" dump badging "$apk" | grep -q "^package: name='com.shawket.strata'"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strata-android-${{ steps.signing.outputs.kind }}
          path: client/app/apps/strata/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strata-android-debug-symbols
          path: client/app/apps/strata/build/debug-info/android/
          retention-days: 90
          if-no-files-found: error

  app-macos:
    name: macOS app (universal, ad-hoc signed)
    runs-on: macos-15
    defaults:
      run:
        working-directory: client/app/apps/strata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust macOS targets
        # cargokit builds every architecture in $ARCHS (arm64 x86_64 for a release build) with
        # `rustup run stable` and joins them with lipo: the app is universal.
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos
          cache-targets: false
      - name: Server address
        # The app refuses to start without an https:// address; fail here instead.
        run: |
          case "$STRATA_SERVER_URL" in
            *[[:space:]]*) echo "::error::STRATA_SERVER_URL contains spaces."; exit 1 ;;
            https://?*) echo "server: $STRATA_SERVER_URL" ;;
            *) echo "::error::STRATA_SERVER_URL must be an https:// address, got '$STRATA_SERVER_URL'."; exit 1 ;;
          esac
      - run: flutter pub get
      - name: Build
        # Dart is obfuscated; its symbols go to build/debug-info/macos for `flutter symbolize`.
        run: |
          flutter build macos --release --build-number "$GITHUB_RUN_NUMBER" \
            --obfuscate --split-debug-info=build/debug-info/macos \
            "--dart-define=STRATA_SERVER_URL=$STRATA_SERVER_URL"
      - name: Ad-hoc sign and verify
        run: |
          mkdir -p dist
          ditto build/macos/Build/Products/Release/strata.app dist/Strata.app
          codesign --force --deep --preserve-metadata=entitlements --sign - dist/Strata.app
          codesign --verify --deep --strict --verbose=2 dist/Strata.app
          codesign --display --entitlements - dist/Strata.app
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' dist/Strata.app/Contents/Info.plist)
          echo "bundle identifier: $bundle_id"
          [ "$bundle_id" = com.shawket.strata ]
          archs=$(lipo -archs dist/Strata.app/Contents/MacOS/strata)
          echo "architectures: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "not universal"; exit 1 ;; esac
      - name: Package (zip and dmg)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="sha-${GITHUB_SHA::7}"; fi
          name="Strata-$v-macos-universal"
          ditto -c -k --keepParent dist/Strata.app "dist/$name.zip"
          mkdir -p dist/dmg && ditto dist/Strata.app dist/dmg/Strata.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Strata -srcfolder dist/dmg -ov -format UDZO "dist/$name.dmg"
          rm -rf dist/dmg dist/Strata.app
          (cd dist && shasum -a 256 -- *.zip *.dmg > SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strata-macos-universal-adhoc
          path: client/app/apps/strata/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strata-macos-debug-symbols
          path: client/app/apps/strata/build/debug-info/macos/
          retention-days: 90
          if-no-files-found: error

  # Publishes every green build as a GitHub release, so the files have stable download links
  # (run artifacts expire and sit behind the run page):
  #   v* tag          -> release "<tag>" (the version)
  #   other pushes    -> the rolling pre-release "latest", replaced on every green build
  release:
    name: Publish release
    needs: [stratad-linux-x86_64, app-android, app-macos]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read # gh run download: this run's artifacts (private repository)
      contents: write # gh release create / delete
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download this run's artifacts
        run: gh run download "$GITHUB_RUN_ID" --dir dl
      - name: Collect files
        run: |
          mkdir -p out
          for d in dl/*/; do
            a=$(basename "$d")
            # The Dart debug symbols stay run artifacts (flutter symbolize), not release files.
            case "$a" in *-debug-symbols) echo "skip $a"; continue ;; esac
            for f in "$d"*; do
              n=$(basename "$f")
              # Each app artifact carries its own SHA256SUMS; keep them apart.
              if [ "$n" = SHA256SUMS ]; then n="SHA256SUMS-$a"; fi
              cp "$f" "out/$n"
            done
          done
          ls -l out
      - name: Publish
        env:
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SERVER: ${{ env.STRATA_SERVER_URL }}
        run: |
          notes="Built from ${SHA::7} on ${REF_NAME}. Apps connect to ${SERVER}.
          Server: stratad-*-linux-x86_64.tar.gz (install and upgrade with VPS_SETUP.md inside it).
          Android: strata-*-android-universal-*.apk, or the arm64-v8a one for most phones.
          macOS: Strata-*-macos-universal.dmg or .zip (ad-hoc signed: right-click → Open the first time)."
          if [ "$REF_TYPE" = tag ]; then
            gh release create "$REF_NAME" out/* --verify-tag --title "Strata $REF_NAME" --notes "$notes"
          else
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest out/* --target "$SHA" --prerelease \
              --title "Latest build (${SHA::7})" --notes "$notes"
          fi
