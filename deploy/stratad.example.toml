# stratad.toml — every setting with its default (PLAN §14 "Config"; docs/RUNBOOK.md).
#
# Install as /etc/strata/stratad.toml (owner root:strata, mode 0640: it holds database
# passwords). Lines starting with `# key =` are optional settings that are unset by default.
# Any key can be overridden from the environment as STRATA__<SECTION>__<KEY> (double
# underscores, case-insensitive), e.g. STRATA__DATABASE__APP_URL=postgres://… or
# STRATA__AI__CLAUDE_CLI__COMMAND='["/usr/bin/claude"]' (arrays as TOML literals). Unknown
# keys, in this file or the environment, stop stratad from starting.

# Root of per-user data (users/<id>/vault); must exist, owned by the service user, mode 0700.
data_root = "/srv/strata"
# Address the API listens on (nginx proxies to it).
bind = "127.0.0.1:8080"
# IANA timezone for users who have not set one (tasks, reminders, digests, timestamps).
default_timezone = "UTC"

[database]
# One URL per role (PLAN §5.2). Put the passwords here or in the environment.
owner_url = "postgres://strata_owner@localhost/strata"      # migrations only
app_url = "postgres://strata_app@localhost/strata"          # requests and jobs (RLS-scoped)
accounts_url = "postgres://strata_accounts@localhost/strata" # login, sign-up, admin
# Connections per pool (the VPS has one core; keep it small).
max_connections = 5

[ai]
# Provider for users without an override: "claude_cli" (claude -p, L18), "anthropic_api"
# (Messages API with a server key) or "disabled". D23: claude -p serves every account.
default_provider = "claude_cli"
# AI jobs per day across all users (0 = unlimited).
daily_job_limit = 0

[ai.user_providers]
# Per-user override, keyed by username exactly as stored, e.g.:
# guest = "anthropic_api"
# kid = "disabled"

[ai.claude_cli]
# Launcher; the claude arguments are appended. Production (docs/RUNBOOK.md §9):
# command = ["sudo", "-n", "-u", "strata-ai", "/usr/local/lib/strata/claude-ai"]
command = ["/usr/local/bin/claude"]
# Empty working directory of the claude process (owned by strata-ai).
scratch_dir = "/var/lib/strata-ai/scratch"
# --model passed to claude (alias or full name); unset lets the CLI choose.
# model = "opus"
# Concurrent claude processes (§9.1: low).
max_concurrency = 1
# Wall-clock limit per call, seconds.
timeout_secs = 300
# Seconds between SIGTERM and SIGKILL of a timed-out or cancelled call.
kill_grace_secs = 5
# Pause after a usage limit without a reported reset time, seconds.
usage_limit_pause_secs = 1800

[ai.anthropic_api]
# API key file (owner strata, mode 0600; never logged). Required when any user is routed to
# anthropic_api.
# api_key_file = "/etc/strata/anthropic.key"
model = "claude-opus-5-5"
base_url = "https://api.anthropic.com"
# output_config.effort: low | medium | high | xhigh | max; unset = the model's default.
# effort = "high"
# Retries after the first attempt on 408/409/429/5xx/529 (honouring retry-after).
max_retries = 3
# Per-request timeout, seconds (whole response, including a stream).
timeout_secs = 600
# Prices of `model` in micro-USD per million tokens, for cost caps (Claude Opus 5.5: $4 / $20).
input_micros_per_mtok = 4000000
output_micros_per_mtok = 20000000

[ai.embedding]
# In-process ONNX embeddings (L19, D9; docs/RUNBOOK.md §10). Off (one log line at startup)
# until both paths are set and exist:
# model_dir = "/opt/models/granite-embedding-97m-multilingual-r2"
# onnxruntime_lib = "/opt/onnxruntime/lib/libonnxruntime.so.1.30.0"
# Relative to model_dir. Full-precision (fp32) export (owner decision 2026-09-27, PLAN §9.1b);
# the int8 file is onnx/model_quint8_avx2.onnx (then use its own model_id and pad_batches = false).
model_file = "onnx/model.onnx"
tokenizer_file = "tokenizer.json"
# Stored with every vector; changing it triggers a full re-embed.
model_id = "ibm-granite/granite-embedding-97m-multilingual-r2@onnx/model"
dims = 384
# "cls" (granite-embedding r2) or "mean".
pooling = "cls"
# Tokens per text (longer texts are truncated) and padded tokens per batch.
max_tokens = 2048
max_batch_tokens = 8192
# Whether texts of different lengths share a padded batch (the fp32 export is padding-invariant;
# off for the quint8 export).
pad_batches = true
# Nice value of the embedding thread (0–19).
nice = 19
# Seconds without an embedding call after which the model is unloaded (frees ≈ 390 MB); the next
# call loads it again (a second or two).
idle_unload_secs = 300

[budgets]
# Daily AI caps; 0 = unlimited. A reached cap pauses (never fails) AI work until the next day.
# Days are counted in this IANA timezone; unset = default_timezone.
# timezone = "Africa/Cairo"
per_user_daily_tokens = 2000000
per_user_daily_cost_micros = 0
global_daily_tokens = 4000000
global_daily_cost_micros = 0

[thresholds]
# AI relations at or above this confidence are applied automatically (§9.4).
relation = 0.7
# Custody events at or above this confidence are applied automatically (§6.12).
custody = 0.85

# Duplicate detection per item kind (§9.7): trigram `near` and embedding `semantic` similarity.
[thresholds.dedupe.alias]
near = 0.8
semantic = 0.9

[thresholds.dedupe.capture]
near = 0.6
semantic = 0.9

[thresholds.dedupe.company]
near = 0.7
semantic = 0.9

[thresholds.dedupe.concept]
near = 0.7
semantic = 0.88

[thresholds.dedupe.document]
near = 0.7
semantic = 0.9

[thresholds.dedupe.note]
near = 0.6
semantic = 0.9

[thresholds.dedupe.person]
near = 0.7
semantic = 0.9

[thresholds.dedupe.place]
near = 0.7
semantic = 0.9

[thresholds.dedupe.task]
near = 0.6
semantic = 0.88

[accounts]
# Days between scheduling a deletion and the purge (D25).
deletion_grace_days = 14
# Accounts allowed to wait for approval at once (§15).
max_pending_signups = 20
# How often the purge job runs, seconds.
purge_interval_secs = 300

[push]
# Server push credentials (D27 later step); files are mode 0600 and never logged.
# fcm_service_account_path = "/etc/strata/fcm.json"
# apns_key_path = "/etc/strata/apns.p8"
# apns_key_id = "ABC123DEFG"
# apns_team_id = "TEAM123456"
# apns_topic = "app.strata"
# wns_credentials_path = "/etc/strata/wns.json"

[auth]
# Ed25519 PKCS#8 PEM key for access tokens (stratad keygen; mode 0600).
signing_key_file = "/etc/strata/token-signing-key.pem"
issuer = "strata"
audience = "strata-api"
# Access-token lifetime, seconds (PLAN §8: 15 minutes).
access_token_ttl_secs = 900
# Absolute lifetime of a device session, days.
session_ttl_days = 90
# Revocation-set reload period, seconds.
revocation_reload_secs = 30
# Take the client IP from X-Forwarded-For (only when nginx is the sole client).
trust_forwarded_for = false
min_password_length = 10

[auth.argon2]
# Argon2id cost for new hashes (OWASP: 19 MiB, 2 passes, 1 lane).
memory_kib = 19456
iterations = 2
parallelism = 1

# Sliding-window rate limits: at most `max` events per `window_secs`.
[auth.rate_limits.login_per_ip]
max = 30
window_secs = 900

[auth.rate_limits.login_per_username]
max = 10
window_secs = 900

[auth.rate_limits.signup_per_ip]
max = 5
window_secs = 3600

[auth.rate_limits.signup_global]
max = 30
window_secs = 3600

# Per user (PLAN §8): `POST /capture` and `POST /ask`.
[auth.rate_limits.capture_per_user]
max = 60
window_secs = 60

[auth.rate_limits.ask_per_user]
max = 20
window_secs = 60

[jobs]
# Background jobs (PLAN §5.2, §9.2): fair round-robin across users. Jobs running at once across
# all users (1 CPU core); embeddings also run one at a time, LLM calls at most
# ai.claude_cli.max_concurrency at a time.
max_concurrency = 2
# Seconds between scheduling passes when nothing is runnable.
poll_interval_secs = 5
# Seconds a user whose queued jobs are all of kinds this build does not run is skipped.
idle_recheck_secs = 60
# Retry delays: first retry after backoff_base_secs, doubling per attempt, at most backoff_max_secs.
backoff_base_secs = 30
backoff_max_secs = 3600
# Local hour (0–23, default_timezone) of the nightly jobs (semantic duplicate sweep).
nightly_hour = 3
# Seconds a graceful shutdown waits for running jobs (unfinished ones are re-queued at start).
shutdown_grace_secs = 30
