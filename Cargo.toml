[workspace]
resolver = "3"
members = [
    "crates/vault-format",
    "crates/text-normalize",
    "crates/domain",
    "backend/crates/common",
    "backend/crates/api",
    "backend/crates/vault",
    "backend/crates/index",
    "backend/crates/jobs",
    "backend/crates/ai",
    "backend/crates/graph",
    "backend/crates/testkit",
    "backend/bin/stratad",
    "api/codegen",
    "api/rust-client",
    "client/core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# internal
vault-format = { path = "crates/vault-format" }
text-normalize = { path = "crates/text-normalize" }
domain = { path = "crates/domain" }
strata-common = { path = "backend/crates/common" }
strata-api = { path = "backend/crates/api" }
strata-vault = { path = "backend/crates/vault" }
strata-index = { path = "backend/crates/index" }
strata-jobs = { path = "backend/crates/jobs" }
strata-ai = { path = "backend/crates/ai" }
strata-graph = { path = "backend/crates/graph" }
strata-testkit = { path = "backend/crates/testkit" }
strata-client = { path = "api/rust-client" }

# external (verify API against the resolved version when adopting)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
ulid = { version = "1", features = ["serde", "uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
proptest = "1"
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"
# vault-format: YAML frontmatter values and CommonMark structure (code/math/heading/block ranges)
yaml-rust2 = "0.13"
pulldown-cmark = { version = "0.13", default-features = false }
# PostgreSQL (sqlx 0.9: query fns take `impl SqlSafeStr`; no TLS needed for local/unix connections)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }
toml = "1"
tempfile = "3"
# wire & contract (strata-api, strata-codegen, strata-client)
actix-web = "4.15"
actix-ws = "0.4"
actix-rt = "2"
utoipa = { version = "6", features = ["chrono", "ulid"] }
rmp = "0.8"
rmpv = { version = "1.3", features = ["with-serde"] }
serde_bytes = "0.11"
serde_path_to_error = "0.1"
mime = "0.3"
percent-encoding = "2.3"
base64 = "0.23"
url = "2.5"
futures-util = "0.3"
bytes = "1"
jsonschema = { version = "0.58", default-features = false }
typify = { version = "0.8", default-features = false }
schemars08 = { package = "schemars", version = "0.8" }
prettyplease = "0.3"
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
regress = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# auth (strata-api, stratad): EdDSA JWTs (RustCrypto backend), the Ed25519 key file (PKCS#8
# PEM), Argon2id, UTS #39 confusable skeletons + Unicode case folding for usernames, streamed
# export zips, the stratad CLI
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
getrandom = "0.3"
unicode-security = "0.1.2"
caseless = "0.2.2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4.6", features = ["derive"] }
