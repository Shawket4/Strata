name: strata_sync
description: >-
  Strata "sync" feature UI: sync status (sheet / drawer / popover), the sync
  pill and conflict resolution. Widgets only; view-models come from the Rust
  core (PLAN L15).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  flutter_localizations:
    sdk: flutter
  hooks_riverpod: ^3.4.3
  strata_l10n: any
  strata_state: any
  strata_ui: any

dev_dependencies:
  alchemist: ^0.14.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
