name: strata_editor
description: >-
  Strata "editor" feature UI: the markdown note editor (super_editor with a
  byte-exact source serialiser, PLAN D2 = b). Widgets only; view-models and
  editor hints come from the Rust core (PLAN L15).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  strata_l10n: any
  strata_state: any
  strata_ui: any
  super_editor: 0.3.0-dev.52

dev_dependencies:
  alchemist: ^0.14.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
