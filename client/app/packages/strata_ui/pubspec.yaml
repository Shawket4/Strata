name: strata_ui
description: >-
  Strata design system: tokens as ThemeExtensions, bundled typography, brand
  marks, adaptive layout primitives and shared widgets. UI only (PLAN L15).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  strata_l10n: any

dev_dependencies:
  alchemist: ^0.14.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/licenses/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
