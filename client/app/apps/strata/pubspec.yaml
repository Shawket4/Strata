name: strata
description: >-
  Strata app shell: boots ProviderScope and MaterialApp.router, typed routes,
  adaptive shell. UI only; all logic lives in the Rust client core (PLAN L15).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.1
  hooks_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  strata_accounts: any
  strata_admin: any
  strata_ask: any
  strata_bridge: any
  strata_directory: any
  strata_documents: any
  strata_editor: any
  strata_home: any
  strata_inbox: any
  strata_l10n: any
  strata_maps: any
  strata_notes: any
  strata_settings: any
  strata_state: any
  strata_sync: any
  strata_tasks: any
  strata_ui: any
  timezone: ^0.11.1

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.16.1
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
