[package]
name = "strata-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Test support for this crate and its consumers: the OpenAPI contract-conformance
# validator (`contract`), an in-process server spawner and a demo router exercising the
# wire machinery (`testing`). Never enabled in production builds.
test-support = ["dep:jsonschema"]

[dependencies]
actix-web = { workspace = true }
actix-ws = { workspace = true }
actix-rt = { workspace = true }
utoipa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
serde_path_to_error = { workspace = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
mime = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true, optional = true }
base64 = { workspace = true }
# auth, accounts and devices (PLAN §8, D6, D22, D25)
strata-common = { workspace = true, features = ["sqlx"] }
strata-index = { workspace = true }
strata-vault = { workspace = true }
# AI pipelines: semantic/hybrid search, Ask, AI status (PLAN §9.5, §7.5 Search/AI)
strata-jobs = { workspace = true }
strata-ai = { workspace = true }
# graph, maps and clustering (PLAN §7.5 Graph, §10)
strata-graph = { workspace = true }
vault-format = { workspace = true }
domain = { workspace = true }
sync-model = { workspace = true }
dedupe = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
ed25519-dalek = { workspace = true }
argon2 = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
unicode-security = { workspace = true }
caseless = { workspace = true }
chrono-tz = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
hex = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
strata-api = { path = ".", features = ["test-support"] }
strata-testkit = { workspace = true }
strata-client = { workspace = true }
strata-jobs = { workspace = true, features = ["test-support"] }
strata-ai = { workspace = true, features = ["test-support"] }
# Crash injection inside vault writes (sync push exactly-once tests).
strata-vault = { workspace = true, features = ["fault-injection"] }
reqwest = { workspace = true }
zip = { workspace = true }
# Hardening suites (PLAN §15, §16.3, §16.7): the production startup checks and request
# logger, log capture, and the synthetic vault generator.
stratad = { path = "../../bin/stratad" }
tracing-subscriber = { workspace = true }

[[bin]]
name = "emit-openapi"
path = "src/bin/emit_openapi.rs"

[lints]
workspace = true
