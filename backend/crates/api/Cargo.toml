[package]
name = "strata-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Test support for this crate and its consumers: the OpenAPI contract-conformance
# validator (`contract`), an in-process server spawner and a demo router exercising the
# wire machinery (`testing`). Never enabled in production builds.
test-support = ["dep:jsonschema"]

[dependencies]
actix-web = { workspace = true }
actix-ws = { workspace = true }
actix-rt = { workspace = true }
utoipa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
serde_path_to_error = { workspace = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
mime = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true, optional = true }
base64 = { workspace = true }
# auth, accounts and devices (PLAN §8, D6, D22, D25)
strata-common = { workspace = true, features = ["sqlx"] }
strata-index = { workspace = true }
strata-vault = { workspace = true }
vault-format = { workspace = true }
domain = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
ed25519-dalek = { workspace = true }
argon2 = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
unicode-security = { workspace = true }
caseless = { workspace = true }
chrono-tz = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
strata-api = { path = ".", features = ["test-support"] }
strata-testkit = { workspace = true }
strata-client = { workspace = true }
reqwest = { workspace = true }

[[bin]]
name = "emit-openapi"
path = "src/bin/emit_openapi.rs"

[lints]
workspace = true
