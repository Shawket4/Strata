[package]
name = "strata-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Strata vault store: per-user single-writer actor, atomic writes, git history, link rewriting, index maintenance, reconciliation, export/import"

[features]
# Crash injection at the boundaries of a write (`VaultService::inject_crash`), for the
# exactly-once tests of sync push. Never enabled in production builds.
fault-injection = []

[dependencies]
vault-format = { workspace = true }
text-normalize = { workspace = true }
domain = { workspace = true }
dedupe = { workspace = true }
sync-model = { workspace = true }
item-render = { workspace = true }
strata-common = { workspace = true, features = ["sqlx"] }
strata-index = { workspace = true }
sqlx = { workspace = true }
git2 = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
ulid = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
strata-testkit = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
